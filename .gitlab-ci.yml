# =====================================================================
#  Pipeline GitLab CI – Nginx WAF Hardened
#  - Version check (schedule only: skip build if up-to-date)
#  - Lint (hadolint + shellcheck)
#  - Build multi-arch via buildx + registry cache
#  - Sign (cosign keyless OIDC GitLab)
#  - Scan (Trivy SARIF)
#  - Release (tarball sur tag)
#
#  Scheduled pipelines: check upstream versions, rebuild only if changed.
#  Configure a pipeline schedule: daily "0 6 * * *"
# =====================================================================

stages:
  - check
  - lint
  - build
  - sign
  - scan
  - release

variables:
  DOCKER_BUILDKIT: "1"
  IMAGE: $CI_REGISTRY_IMAGE
  COSIGN_EXPERIMENTAL: "1"

default:
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - docker info >/dev/null
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - |
      if [ -n "$DOCKERHUB_TOKEN" ]; then
        echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USER" --password-stdin docker.io
      fi

workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"

# ---------- VERSION CHECK (scheduled only) ------------------------------
# Compares upstream versions with current image. Stops pipeline early
# if no update is needed (exits non-zero → pipeline stops gracefully).
version-check:
  stage: check
  image: alpine:3.21
  before_script: []
  services: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - apk add --no-cache curl jq grep
    - |
      NGINX_LATEST=$(curl -fsSL https://nginx.org/en/download.html \
        | grep -oP 'Stable version</h4>.*?Legacy' \
        | grep -oP 'nginx-\K[0-9]+\.[0-9]+\.[0-9]+' | sed -n '1p')
      MODSEC_LATEST=$(curl -fsSL https://api.github.com/repos/owasp-modsecurity/ModSecurity/releases/latest \
        | jq -r '.tag_name' | sed 's/^v//')
      CRS_LATEST=$(curl -fsSL https://api.github.com/repos/coreruleset/coreruleset/releases/latest \
        | jq -r '.tag_name' | sed 's/^v//')

      echo "Upstream: nginx=${NGINX_LATEST} modsec=${MODSEC_LATEST} crs=${CRS_LATEST}"

      # Try to read current versions from registry image manifest annotations
      # If we can't inspect, we rebuild (safe default)
      export TRIVY_USERNAME="$CI_REGISTRY_USER"
      export TRIVY_PASSWORD="$CI_REGISTRY_PASSWORD"

      CURRENT_LABELS=$(curl -fsSL -u "${CI_REGISTRY_USER}:${CI_REGISTRY_PASSWORD}" \
        "https://${CI_REGISTRY}/v2/${CI_PROJECT_PATH}/manifests/latest" \
        -H "Accept: application/vnd.oci.image.manifest.v1+json" 2>/dev/null | \
        jq -r '.annotations["versions"] // empty' || echo "")

      if [ -z "$CURRENT_LABELS" ]; then
        echo "Cannot read current image versions, rebuilding..."
        echo "REBUILD=true" > version-check.env
      else
        CURRENT_NGINX=$(echo "$CURRENT_LABELS" | grep -oP 'nginx=\K[0-9.]+' || echo "none")
        CURRENT_MODSEC=$(echo "$CURRENT_LABELS" | grep -oP 'modsec=\K[0-9.]+' || echo "none")
        CURRENT_CRS=$(echo "$CURRENT_LABELS" | grep -oP 'crs=\K[0-9.]+' || echo "none")

        echo "Current: nginx=${CURRENT_NGINX} modsec=${CURRENT_MODSEC} crs=${CURRENT_CRS}"

        if [ "$NGINX_LATEST" = "$CURRENT_NGINX" ] && \
           [ "$MODSEC_LATEST" = "$CURRENT_MODSEC" ] && \
           [ "$CRS_LATEST" = "$CURRENT_CRS" ]; then
          echo "All versions up-to-date, skipping rebuild."
          echo "REBUILD=false" > version-check.env
        else
          echo "Update detected! Rebuilding..."
          echo "REBUILD=true" > version-check.env
        fi
      fi

      echo "NGINX_VER=${NGINX_LATEST}" >> version-check.env
      echo "MODSEC_VER=${MODSEC_LATEST}" >> version-check.env
      echo "CRS_VER=${CRS_LATEST}" >> version-check.env
      cat version-check.env
  artifacts:
    reports:
      dotenv: version-check.env
    expire_in: 1 day

# ---------- LINT --------------------------------------------------------
hadolint:
  stage: lint
  image: hadolint/hadolint:latest-alpine
  before_script: []
  services: []
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
  script:
    - hadolint --failure-threshold warning Dockerfile

shellcheck:
  stage: lint
  image: koalaman/shellcheck-alpine:stable
  before_script: []
  services: []
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
  script:
    - shellcheck scripts/*.sh

# ---------- BUILD -------------------------------------------------------
build:
  stage: build
  rules:
    # On schedule: only run if version-check says REBUILD=true
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: on_success
    # On push/tag/MR: always run
    - when: on_success
  script:
    - apk add --no-cache git curl grep jq
    # Skip if scheduled and no rebuild needed
    - |
      if [ "$CI_PIPELINE_SOURCE" = "schedule" ] && [ "${REBUILD:-true}" = "false" ]; then
        echo "No upstream changes detected, skipping build."
        exit 0
      fi
    # Resolve nginx version for tagging (from version-check env or fetch now)
    - |
      if [ -n "${NGINX_VER:-}" ]; then
        RESOLVED_NGINX="${NGINX_VER}"
      else
        RESOLVED_NGINX=$(curl -fsSL https://nginx.org/en/download.html \
          | grep -oP 'Stable version</h4>.*?Legacy' \
          | grep -oP 'nginx-\K[0-9]+\.[0-9]+\.[0-9]+' | sed -n '1p')
      fi
      if [ -n "${MODSEC_VER:-}" ]; then
        RESOLVED_MODSEC="${MODSEC_VER}"
      else
        RESOLVED_MODSEC=$(curl -fsSL https://api.github.com/repos/owasp-modsecurity/ModSecurity/releases/latest \
          | jq -r '.tag_name' | sed 's/^v//')
      fi
      if [ -n "${CRS_VER:-}" ]; then
        RESOLVED_CRS="${CRS_VER}"
      else
        RESOLVED_CRS=$(curl -fsSL https://api.github.com/repos/coreruleset/coreruleset/releases/latest \
          | jq -r '.tag_name' | sed 's/^v//')
      fi
      echo "Building: nginx=${RESOLVED_NGINX} modsec=${RESOLVED_MODSEC} crs=${RESOLVED_CRS}"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        TAG="$CI_COMMIT_TAG"
      else
        TAG="${RESOLVED_NGINX}"
      fi
    # Build with DOCKER_BUILDKIT (no separate builder container = auth works)
    - |
      docker build \
        --build-arg BUILDKIT_INLINE_CACHE=1 \
        --build-arg http_proxy="${http_proxy:-}" \
        --build-arg https_proxy="${https_proxy:-}" \
        --build-arg HTTP_PROXY="${HTTP_PROXY:-}" \
        --build-arg HTTPS_PROXY="${HTTPS_PROXY:-}" \
        --build-arg no_proxy="${no_proxy:-}" \
        --build-arg NO_PROXY="${NO_PROXY:-}" \
        --build-arg NGINX_VER="${RESOLVED_NGINX}" \
        --build-arg MODSEC_VER="${RESOLVED_MODSEC}" \
        --build-arg OWASP_CRS_VER="${RESOLVED_CRS}" \
        --label "org.opencontainers.image.source=${CI_PROJECT_URL}" \
        --label "org.opencontainers.image.revision=${CI_COMMIT_SHA}" \
        --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
        --label "org.opencontainers.image.version=${RESOLVED_NGINX}" \
        --label "versions=nginx=${RESOLVED_NGINX} modsec=${RESOLVED_MODSEC} crs=${RESOLVED_CRS}" \
        -t ${IMAGE}:${TAG} \
        -t ${IMAGE}:${RESOLVED_NGINX} \
        -t ${IMAGE}:latest \
        .
    # Push all tags
    - docker push ${IMAGE}:${TAG}
    - docker push ${IMAGE}:${RESOLVED_NGINX}
    - docker push ${IMAGE}:latest
    - docker inspect ${IMAGE}:${TAG} | jq -r '.[0].RepoDigests[0]' | tee image-digest.txt
  artifacts:
    paths:
      - image-digest.txt
    expire_in: 30 days
  tags:
    - build

# ---------- SIGN (cosign keyless OIDC) ----------------------------------
sign:
  stage: sign
  image: alpine:3.21
  before_script: []
  services: []
  needs: ["build"]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: on_success
    - when: on_success
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  script:
    - |
      if [ ! -f image-digest.txt ]; then
        echo "No image built (up-to-date), skipping sign."
        exit 0
      fi
    - apk add --no-cache cosign
    - DIGEST=$(grep -o 'sha256:[a-f0-9]*' image-digest.txt | sed -n '1p')
    - cosign sign --yes ${IMAGE}@${DIGEST}
  allow_failure: true

# ---------- SCAN --------------------------------------------------------
scan:
  stage: scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  before_script: []
  services: []
  needs: ["build"]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: on_success
    - when: on_success
  script:
    - |
      if [ ! -f image-digest.txt ]; then
        echo "No image built (up-to-date), skipping scan."
        exit 0
      fi
    - export TRIVY_USERNAME="$CI_REGISTRY_USER"
    - export TRIVY_PASSWORD="$CI_REGISTRY_PASSWORD"
    - export SSL_CERT_FILE="/etc/ssl/certs/ca-certificates.crt"
    - trivy image --severity HIGH,CRITICAL --ignore-unfixed
        --format sarif --output trivy-nginx.sarif
        ${IMAGE}:latest
    - trivy image --severity HIGH,CRITICAL --ignore-unfixed
        ${IMAGE}:latest
  artifacts:
    paths:
      - trivy-*.sarif
    reports:
      sast: trivy-nginx.sarif
    expire_in: 90 days
  allow_failure: true

# ---------- RELEASE (sur tag) -------------------------------------------
release:tarball:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  image: alpine:3.21
  before_script: []
  services: []
  script:
    - apk add --no-cache tar gzip coreutils
    - mkdir -p dist
    - tar --exclude='.git' --exclude='dist'
          --transform "s,^,nginx-waf-${CI_COMMIT_TAG}/,"
          -czf dist/nginx-waf-${CI_COMMIT_TAG}.tar.gz .
    - cd dist && sha256sum nginx-waf-${CI_COMMIT_TAG}.tar.gz > nginx-waf-${CI_COMMIT_TAG}.tar.gz.sha256
  artifacts:
    paths:
      - dist/
    expire_in: never
