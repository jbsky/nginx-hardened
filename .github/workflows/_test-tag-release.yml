# Throwaway workflow to verify that action-gh-release can create a brand
# new tag with the default GITHUB_TOKEN in this repo (whose history touches
# .github/workflows/*), without hitting the "refusing to allow a GitHub App
# to create or update workflow ... without workflows permission" restriction
# that a plain `git push <newtag>` hits. Delete after use.
name: _test-tag-release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: test-tag-release-permission-check
          name: "TEST - safe to delete"
          body: "Throwaway test of action-gh-release tag creation with GITHUB_TOKEN. Safe to delete."
          generate_release_notes: false
          prerelease: true
