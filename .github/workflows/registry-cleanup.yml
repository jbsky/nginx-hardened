# =====================================================================
#  Registry Cleanup -- purge des anciens tags immuables, a la demande.
#  build-push appelle directement jbsky/hardened-ci apres chaque
#  publication ; ce fichier ne sert qu'au lancement manuel (rattrapage).
# =====================================================================
name: registry-cleanup

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  prune:
    uses: jbsky/hardened-ci/.github/workflows/registry-cleanup.yml@8c22d396d42e663d887de0aca16a5fad4e8659f8 # v1.3.1
    with:
      images: '["nginx-waf-hardened"]'
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
