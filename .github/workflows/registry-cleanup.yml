# =====================================================================
#  Registry Cleanup -- purge des anciens tags immuables, a la demande.
#  build-push appelle directement jbsky/hardened-ci apres chaque
#  publication ; ce fichier ne sert qu'au lancement manuel (rattrapage).
# =====================================================================
name: registry-cleanup

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  prune:
    uses: jbsky/hardened-ci/.github/workflows/registry-cleanup.yml@f03656aea5096948c717528a25c04c682e6351ac # v1.4.8
    with:
      images: '["nginx-waf-hardened"]'
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
