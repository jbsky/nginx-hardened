# =====================================================================
#  Registry Cleanup -- purge des anciens tags immuables, a la demande.
#  build-push appelle directement jbsky/hardened-ci apres chaque
#  publication ; ce fichier ne sert qu'au lancement manuel (rattrapage).
# =====================================================================
name: registry-cleanup

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  prune:
    uses: jbsky/hardened-ci/.github/workflows/registry-cleanup.yml@20dbd2ae1f65f1d72d88ec7a3c78ed716ba2009e # v1.2.0
    with:
      images: '["nginx-waf-hardened"]'
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
