# =====================================================================
#  Audit sécurité hebdomadaire
#  - Trivy (CVE + secrets + misconfig)
#  - Grype (cross-check)
#  - Vérification signature cosign
# =====================================================================
name: security-audit

on:
  schedule:
    - cron: '0 3 * * 2'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}
  IMAGE_NAME: nginx-waf-hardened

permissions:
  contents: read
  security-events: write
  packages: read
  issues: write

jobs:
  audit:
    name: Audit nginx-waf-hardened
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0 : build-revision.sh compte les commits, un clone
      # superficiel ferait de chaque image une .0
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Scripts partages (build-revision, image-manifest, ...) : ceux de
      # hardened-ci a la ref epinglee, plus aucune copie dans ce depot.
      - name: Scripts partages de hardened-ci
        id: hci
        uses: jbsky/hardened-ci/tools@37f84a73b14b4da3f00004f94977d5f2f35d2635 # v0.8.0

      # Trivy ne voit dans cette image FROM scratch que ce qui garde une
      # metadonnee de paquet (binaire Go d'init) : le service et ses
      # bibliotheques C n'ont plus de base apk a lire. Un « 0 CVE » ne prouve
      # donc rien sur elles. Ce qui les garde a jour, c'est la reconstruction --
      # et du 2026-09-10 au 09-30 plus aucune n'aboutissait, en silence. Cette
      # etape verifie que le tag que main doit produire existe dans le registre.
      - name: main est publie
        run: |
          set -euo pipefail
          # Meme version et memes arguments que les jobs revision et
          # update-readme de build-push. Jusqu'au 2026-10-03 cette etape lisait
          # encore nginx.org (avant l'epinglage dans versions.json) avec trois
          # chemins de moins : elle cherchait 1.30.5.18 quand main publiait
          # 1.30.5.20, et aurait echoue a chaque audit.
          VERSION=$(jq -r '.nginx' versions.json)
          REVISION=$("${{ steps.hci.outputs.dir }}/build-revision.sh" --unanchored -- Dockerfile conf/ errors/ init.go go.mod keys/ versions.json)
          TAG="${VERSION}.${REVISION}"
          if docker manifest inspect "${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_NAME }}:${TAG}" >/dev/null; then
            echo "OK -- ${TAG} est publie"
          else
            echo "::error::main devrait publier ${{ env.IMAGE_NAME }}:${TAG}, absent du registre -- le dernier build-push de main a echoue ?"
            exit 1
          fi

      - name: Trivy full scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_NAME }}:latest
          format: sarif
          output: trivy-nginx.sarif
          severity: CRITICAL,HIGH,MEDIUM
          scanners: vuln,secret,misconfig
          ignore-unfixed: false

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-nginx.sarif
          category: audit-nginx

      # Trivy is a gate, not just a printout. On 2026-08-18 grype reported
      # "No vulnerabilities found" on squid/c-icap/clamav/bind9 :latest while
      # trivy listed 8 High Go stdlib CVEs in the very same init binary -- the
      # audits stayed green for weeks while shipping them. Two scanners are
      # only worth running if both can fail the job; `ignore-unfixed` keeps
      # the semantics aligned with grype's `--only-fixed`.
      - name: Trivy summary
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_NAME }}:latest
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      # Action epinglee plutot que `curl .../grype/main/install.sh | sh` : le
      # script d'installation suivait la branche main d'un depot tiers, sans
      # version ni empreinte. Memes seuils qu'avant (high+, corrigeables).
      - name: Grype scan
        uses: anchore/scan-action@v7
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_NAME }}:latest
          fail-build: 'true'
          severity-cutoff: high
          only-fixed: 'true'
          output-format: table

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Verify cosign signature
        run: |
          cosign verify ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_NAME }}:latest \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

  notify:
    name: Notification si echec
    needs: audit
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Issue automatique
        uses: actions/github-script@v9
        with:
          script: |
            const today = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Security] Weekly audit failed - ${today}`,
              body: `Audit du ${today} a detecte des CVE ou un echec de verification. Voir le run.\n\n${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['security','automated']
            });
