# =====================================================================
#  Audit sécurité hebdomadaire
#  - Trivy (CVE + secrets + misconfig)
#  - Grype (cross-check)
#  - Vérification signature cosign
# =====================================================================
name: security-audit

on:
  schedule:
    - cron: '0 3 * * 2'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}
  IMAGE_NAME: nginx-waf-hardened

permissions:
  contents: read
  security-events: write
  packages: read
  issues: write

jobs:
  audit:
    name: Audit nginx-waf-hardened
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Trivy full scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_NAME }}:latest
          format: sarif
          output: trivy-nginx.sarif
          severity: CRITICAL,HIGH,MEDIUM
          scanners: vuln,secret,misconfig
          ignore-unfixed: false

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-nginx.sarif
          category: audit-nginx

      # Trivy is a gate, not just a printout. On 2026-08-18 grype reported
      # "No vulnerabilities found" on squid/c-icap/clamav/bind9 :latest while
      # trivy listed 8 High Go stdlib CVEs in the very same init binary -- the
      # audits stayed green for weeks while shipping them. Two scanners are
      # only worth running if both can fail the job; `ignore-unfixed` keeps
      # the semantics aligned with grype's `--only-fixed`.
      - name: Trivy summary
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_NAME }}:latest
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Install Grype
        run: curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Grype scan
        run: |
          grype ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_NAME }}:latest \
                --fail-on high --only-fixed

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Verify cosign signature
        run: |
          cosign verify ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_NAME }}:latest \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

  notify:
    name: Notification si echec
    needs: audit
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Issue automatique
        uses: actions/github-script@v9
        with:
          script: |
            const today = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Security] Weekly audit failed - ${today}`,
              body: `Audit du ${today} a detecte des CVE ou un echec de verification. Voir le run.\n\n${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['security','automated']
            });
