# =====================================================================
#  security-audit -- audit hebdomadaire de nginx-waf-hardened (gabarit hardened-ci) :
#  tag attendu de main publie, Trivy, Grype, signature cosign (identite +
#  depot source) ; une seule issue `security`, run rouge si un controle echoue.
# =====================================================================
name: security-audit

on:
  schedule:
    - cron: '0 3 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    uses: jbsky/hardened-ci/.github/workflows/security-audit.yml@436323be243da88352810666340efa486c12ac0c # v1.4.4
    permissions:
      contents: read
      packages: read
      security-events: write
      issues: write
