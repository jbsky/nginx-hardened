# =====================================================================
#  Version Watch — Nginx, ModSecurity et OWASP CRS
#
#  Quotidien 06h00 UTC :
#    1. Interroge nginx.org + l'API GitHub pour les dernieres versions
#    2. Compare avec versions.json
#    3. Si une version a bouge : bump versions.json → commit → push,
#       puis dispatch de build-push
#
#  Ce workflow ne publie plus d'image. Jusqu'au 2026-10, il construisait et
#  poussait lui-meme, sans que la version de ModSecurity ni de CRS entre dans
#  le tag : nginx-waf-hardened:1.30.5.16 a ainsi porte trois images
#  differentes. versions.json est un input du compteur de revision, donc
#  chaque bump donne un nouveau tag immuable, et la publication passe par
#  les portes de build-push (tests, manifeste, cloture).
# =====================================================================
name: version-watch

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  check:
    name: Check & bump upstream versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check upstream versions
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          NGINX_LATEST=$(curl -fsSL https://nginx.org/en/download.html \
            | grep -oP 'Stable version</h4>.*?Legacy' \
            | grep -oP 'nginx-\K[0-9]+\.[0-9]+\.[0-9]+' | sed -n '1p')
          MODSEC_LATEST=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
            https://api.github.com/repos/owasp-modsecurity/ModSecurity/releases/latest \
            | jq -r '.tag_name' | sed 's/^v//')
          CRS_LATEST=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
            https://api.github.com/repos/coreruleset/coreruleset/releases/latest \
            | jq -r '.tag_name' | sed 's/^v//')

          # Une page qui change de forme rendrait une chaine vide : on ne
          # committe jamais une version qui n'en est pas une.
          for v in "$NGINX_LATEST" "$MODSEC_LATEST" "$CRS_LATEST"; do
            [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "::error::version amont illisible : '${v}'"; exit 1; }
          done

          CURRENT_NGINX=$(jq -r '.nginx' versions.json)
          CURRENT_MODSEC=$(jq -r '.modsecurity' versions.json)
          CURRENT_CRS=$(jq -r '."owasp-crs"' versions.json)

          echo "Upstream: nginx=${NGINX_LATEST} modsec=${MODSEC_LATEST} crs=${CRS_LATEST}"
          echo "Pinned:   nginx=${CURRENT_NGINX} modsec=${CURRENT_MODSEC} crs=${CURRENT_CRS}"

          CHANGES=()
          [ "$NGINX_LATEST" != "$CURRENT_NGINX" ] && CHANGES+=("nginx ${CURRENT_NGINX} → ${NGINX_LATEST}")
          [ "$MODSEC_LATEST" != "$CURRENT_MODSEC" ] && CHANGES+=("modsecurity ${CURRENT_MODSEC} → ${MODSEC_LATEST}")
          [ "$CRS_LATEST" != "$CURRENT_CRS" ] && CHANGES+=("owasp-crs ${CURRENT_CRS} → ${CRS_LATEST}")

          if [ "${#CHANGES[@]}" -eq 0 ]; then
            echo "Already up to date"
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SUMMARY=$(printf '%s, ' "${CHANGES[@]}")
          {
            echo "updated=true"
            echo "nginx=${NGINX_LATEST}"
            echo "modsec=${MODSEC_LATEST}"
            echo "crs=${CRS_LATEST}"
            echo "summary=${SUMMARY%, }"
          } >> "$GITHUB_OUTPUT"
          printf -- '- %s\n' "${CHANGES[@]}" >> "$GITHUB_STEP_SUMMARY"

      - name: Bump versions.json
        if: steps.check.outputs.updated == 'true'
        env:
          NGINX: ${{ steps.check.outputs.nginx }}
          MODSEC: ${{ steps.check.outputs.modsec }}
          CRS: ${{ steps.check.outputs.crs }}
        run: |
          set -euo pipefail
          jq --arg n "$NGINX" --arg m "$MODSEC" --arg c "$CRS" \
            '.nginx = $n | .modsecurity = $m | ."owasp-crs" = $c' \
            versions.json > versions.json.tmp
          mv versions.json.tmp versions.json
          cat versions.json

      - name: Commit & push
        if: steps.check.outputs.updated == 'true'
        env:
          SUMMARY: ${{ steps.check.outputs.summary }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add versions.json
          git commit -m "chore(deps): bump ${SUMMARY}"
          git push

      - name: Trigger build-push
        if: steps.check.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A push made with GITHUB_TOKEN does not trigger `on: push` workflows
          # (anti-recursion protection). Explicitly dispatch build-push instead.
          gh workflow run build-push.yml --ref main
