version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    labels: ["dependencies", "github-actions"]
    commit-message:
      prefix: "ci"
      include: "scope"

  - package-ecosystem: "docker"
    directory: "/"
    # Quotidien : un digest de base corrige une CVE (Go dans init, Python,
    # Alpine) ; en hebdomadaire le correctif attendait jusqu'au lundi
    # (CVE-2026-78667, 2026-10-09).
    schedule:
      interval: "daily"
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "build(nginx)"
