# Catch-all: drop invalid Host
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /var/www/html;
    index index.html;

    location = /healthz {
        access_log off;
        modsecurity off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location /vts-status {
        vhost_traffic_status_display;
        vhost_traffic_status_display_format html;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;
    }

    location ^~ /errors/ {
        internal;
        root /usr/share/nginx;
    }

    location / {
        if ($bad_client) { return 444; }
        if ($block_empty_ua) { return 444; }
        if ($allowed_country = no) { return 403; }

        limit_conn conn_per_ip 20;
        limit_req zone=req_per_ip burst=20 nodelay;

        modsecurity on;
        modsecurity_rules_file /etc/nginx/modsec/main.conf;

        limit_except GET HEAD POST { deny all; }
        try_files $uri $uri/ =404;
    }

    location ~* \.(sh|pl|py|lua|inc|phar|php_|log|ini|sql|conf|yml|yaml|zip|tar|gz|bak|swp|old)$ {
        deny all; log_not_found off;
    }
    location ~ /\.(svn|git|hg|htpasswd|bash|ssh|env|DS_Store) {
        deny all; log_not_found off;
    }
    location ~ /\. { deny all; log_not_found off; }
    location ~* /(wp-admin|wp-login|xmlrpc\.php|phpmyadmin|adminer) {
        deny all; log_not_found off;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|webp|avif|svg)$ {
        expires 30d; access_log off;
        add_header Cache-Control "public, immutable";
    }
    location ~* \.(woff|woff2|ttf|otf|eot)$ {
        expires 30d; access_log off;
        add_header Cache-Control "public, immutable";
    }

    location ^~ /.well-known/acme-challenge/ { allow all; root /var/www/html; }

    if ($request_method ~ ^(TRACE|TRACK)$) { return 405; }
}
