# =====================================================================
#  Hardened Nginx — nginx.conf
# =====================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

load_module modules/ngx_http_modsecurity_module.so;
load_module modules/ngx_http_geoip2_module.so;
load_module modules/ngx_http_vhost_traffic_status_module.so;
load_module modules/ngx_http_headers_more_filter_module.so;

error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    index index.html;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    map $request_uri $loggable { /healthz 0; default 1; }
    access_log /var/log/nginx/access.log main if=$loggable;

    # --- Performance ---
    sendfile on; tcp_nopush on; tcp_nodelay on; aio on;

    # --- Timeouts (anti-slowloris) ---
    keepalive_timeout 15;
    client_body_timeout 10;
    client_header_timeout 10;
    send_timeout 10;
    reset_timedout_connection on;

    # --- Buffers ---
    client_max_body_size 10m;
    client_body_buffer_size 16k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # --- Hide server info ---
    server_tokens off;
    more_clear_headers Server;

    # --- VTS ---
    vhost_traffic_status_zone;

    # --- Rate limiting ---
    geo $limit {
        default 1;
        10.0.0.0/8 0;
        172.16.0.0/12 0;
        192.168.0.0/16 0;
        127.0.0.0/8 0;
    }
    map $limit $limit_key { 0 ""; 1 $binary_remote_addr; }
    limit_conn_zone $limit_key zone=conn_per_ip:10m;
    limit_req_zone  $limit_key zone=req_per_ip:10m rate=10r/s;
    limit_req_zone  $limit_key zone=strict:10m rate=2r/s;
    limit_conn_status 429;
    limit_req_status  429;

    # --- File cache ---
    open_file_cache max=10000 inactive=30s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # --- Gzip ---
    gzip on; gzip_vary on; gzip_proxied any;
    gzip_comp_level 5; gzip_min_length 256;
    gzip_types application/atom+xml application/javascript application/json
               application/ld+json application/manifest+json application/rss+xml
               application/vnd.ms-fontobject application/wasm application/xhtml+xml
               application/xml font/opentype image/bmp image/svg+xml image/x-icon
               text/cache-manifest text/css text/plain text/javascript text/vtt;

    # --- GeoIP2 ---
    geoip2 /etc/nginx/geoip/dbip-country-lite.mmdb {
        $geoip2_data_country_code country iso_code;
    }
    map $geoip2_data_country_code $allowed_country {
        default no;
        '' yes;
        FR yes;
    }

    # --- HSTS ---
    map $scheme $hsts_header { https "max-age=63072000; includeSubDomains; preload"; }

    # --- Bad bots ---
    map $http_user_agent $bad_client {
        default 0;
        ~*(360Spider|aiHitBot|AhrefsBot) 1;
        ~*(betaBot|BlackWidow|Bolt|BLEXBot|BUbiNG) 1;
        ~*(CazoodleBot|CPython|CCBot|ChinaClaw|CRAZYWEBCRAWLER) 1;
        ~*(DISCo|discobot|Exabot|EirGrabber|EmailCollector|ExtractorPro) 1;
        ~*(FlashGet|Findxbot|GetRight|GrabNet|GuzzleHttp) 1;
        ~*(heritrix|HaosouSpider|HTTrack|ia_archiver|IRLbot) 1;
        ~*(larbin|LeechFTP|LinkpadBot|lwp-trivial|ltx71) 1;
        ~*(Mail.RU_Bot|MegaIndex.ru|MJ12bot|MSFrontPage) 1;
        ~*(Navroad|NetAnts|NetSpider|NetZIP|Nutch) 1;
        ~*(PageGrabber|PHPCrawl|PleaseCrawl|psbot) 1;
        ~*(Scrapy|Screaming|SemrushBot|SiteSnagger|sqlmap) 1;
        ~*(Teleport|TwengaBot|Typhoeus|Vagabondo|Visbot) 1;
        ~*(WebCollage|WebCopier|WebReaper|WebZIP|Wget|Widow) 1;
        ~*(WWW-Mechanize|WWWOFFLE|Zeus|ZyBorg) 1;
    }
    map $http_user_agent $block_empty_ua { default 0; "" 1; }

    # --- Security headers ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    add_header Strict-Transport-Security $hsts_header always;

    # --- Error pages ---
    error_page 403 /errors/403.html;
    error_page 404 /errors/404.html;
    error_page 410 /errors/410.html;
    error_page 500 501 502 503 504 /errors/5xx.html;

    include /etc/nginx/conf.d/*.conf;
}
